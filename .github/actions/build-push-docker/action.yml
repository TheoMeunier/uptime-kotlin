name: build-push-docker.yml
description: Build a Docker image and optionally push it to GitHub Container Registry

inputs:
  name:
    description: "component name"
    required: true
  image-name:
    description: "Docker image name"
    required: true
  context:
    description: "Docker build context"
    default: .
  docker-path-file:
    description: "path to the Dockerfile"
    required: false
    default: ''
  registry-token:
    required: false
    default: ''
    description: "registry token"
  push:
    required: false
    default: 'true'
    description: "push the image to the registry"

runs:
  using: 'composite'

  steps:
    - name: Login to GitHub Container Registry
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/${{ inputs.image-name }}
        tags: |
          type=ref,event=tag
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      if: ${{ inputs.docker-path-file != '' }}
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.docker-path-file }}
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.push != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push
      if: ${{ inputs.docker-path-file == '' }}
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.push != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
