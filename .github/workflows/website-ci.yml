name: Website CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths: [ 'apps/website/**', '.github/workflows/website-ci.yml' ]

env:
  WORKING_DIRECTORY: apps/website
  CACHE_PATH: apps/website/package-lock.json

jobs:
  vulnerability-scan:
    uses: ./.github/workflows/templates/front/front_security.yml
    with:
      working-directory: ${{ env.WORKING_DIRECTORY }}
      cache-path: ${{ env.CACHE_PATH }}

  lint:
    uses: ./.github/workflows/templates/front/front_lint.yml
    with:
      working-directory: ${{ env.WORKING_DIRECTORY }}
      cache-path: ${{ env.CACHE_PATH }}

  build:
    uses: ./.github/workflows/templates/front/front_build.yml
    with:
      working-directory: ${{ env.WORKING_DIRECTORY }}
      cache-path: apps/app/package-lock.json
      artifact-path: ${{ env.CACHE_PATH }}