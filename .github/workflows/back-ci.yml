name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck

  build:
    name: Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uptime-kotlin
          POSTGRES_USER: uptime-kotlin
          POSTGRES_PASSWORD: uptime-kotlin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test
        env:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/uptime-kotlin
          QUARKUS_DATASOURCE_USERNAME: uptime-kotlin
          QUARKUS_DATASOURCE_PASSWORD: uptime-kotlin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: quarkus-app
          path: backend/build/quarkus-app/
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Used by the @QuarkusTest tests (default datasource).
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uptime-kotlin
          POSTGRES_USER: uptime-kotlin
          POSTGRES_PASSWORD: uptime-kotlin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # Dedicated database for the deployment tests (see CONTRIBUTING.md).
      postgres-deployments:
        image: postgres:16
        env:
          POSTGRES_DB: uptime-kotlin-test
          POSTGRES_USER: uptime-kotlin
          POSTGRES_PASSWORD: uptime-kotlin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test
        env:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/uptime-kotlin
          QUARKUS_DATASOURCE_USERNAME: uptime-kotlin
          QUARKUS_DATASOURCE_PASSWORD: uptime-kotlin
          UPTIME_TEST_JDBC_URL: jdbc:postgresql://localhost:5433/uptime-kotlin-test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  native-image:
    name: Native image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            docker-image: api
            project-path: :backend:api
            dockerfile: ./backend/api/src/main/docker/Dockerfile.native
            context: ./backend/api
          - name: worker
            docker-image: worker
            project-path: :backend:worker
            dockerfile: ./backend/worker/src/main/docker/Dockerfile.native
            context: ./backend/worker

    steps:
      - uses: actions/checkout@v7

      - name: Build native executable and Docker image
        uses: ./.github/actions/backend/build-push-docker-native
        with:
          name: ${{ matrix.name }}
          docker-image: ${{ matrix.docker-image }}
          project-path-build: ${{ matrix.project-path }}
          dockerfile-path: ${{ matrix.dockerfile }}
          context: ${{ matrix.context }}
          push: 'false'
