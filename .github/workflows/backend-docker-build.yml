name: api-docker-build-and-push

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  api-build-native:
    name: api native build and push docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: API native build
        uses: ./.github/actions/backend/build-push-docker-native
        with:
          name: api
          docker-image: api
          dockerfile-path: ./backend/api/src/main/docker/Dockerfile.native
          project-path-build: :backend:api
          registry-token: ${{ secrets.GH_TOKEN }}
          context: ./backend/api

  api-build-jvm:
    name: api jvm build and push docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: API jvm build
        uses: ./.github/actions/backend/build-push-docker-jvm
        with:
          name: api
          docker-image: api-jvm
          dockerfile-path: ./backend/api/src/main/docker/Dockerfile.jvm
          project-path-build: :backend:api
          registry-token: ${{ secrets.GH_TOKEN }}
          context: ./backend/api

  worker-monitor-build-native:
    name: worker monitor native build and push docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Worker monitor native build
        uses: ./.github/actions/backend/build-push-docker-native
        with:
          name: worker
          docker-image: worker
          dockerfile-path: ./backend/worker/src/main/docker/Dockerfile.native
          project-path-build: :backend:worker
          registry-token: ${{ secrets.GH_TOKEN }}
          context: ./backend/worker

  worker-monitor-build-jvm:
    name: worker monitor jvm build and push docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Worker monitor jvm build
        uses: ./.github/actions/backend/build-push-docker-jvm
        with:
          name: worker
          docker-image: worker-jvm
          dockerfile-path: ./backend/worker/src/main/docker/Dockerfile.jvm
          project-path-build: :backend:worker
          registry-token: ${{ secrets.GH_TOKEN }}
          context: ./backend/worker

  api-build-native-arm64:
    name: api native arm64 build and push docker image
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Api native arm64 build
        uses: ./.github/actions/backend/build-push-docker-native
        with:
          name: api
          docker-image: api-arm64
          artifact-name: backend-api-native-arm64
          dockerfile-path: ./backend/api/src/main/docker/Dockerfile.native
          project-path-build: :backend:api
          registry-token: ${{ secrets.GH_TOKEN }}
          context: ./backend/api
          container-build: 'true'

  worker-monitor-build-native-arm64:
    name: worker monitor native arm64 build and push docker image
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Worker monitor native arm64 build
        uses: ./.github/actions/backend/build-push-docker-native
        with:
          name: worker
          docker-image: worker-arm64
          artifact-name: backend-worker-native-arm64
          dockerfile-path: ./backend/worker/src/main/docker/Dockerfile.native
          project-path-build: :backend:worker
          registry-token: ${{ secrets.GH_TOKEN }}
          context: ./backend/worker
          container-build: 'true'
