name: build-push-docker-native.yml

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      docker-image:
        type: string
        required: true
      project-path-build:
        type: string
        required: true
      dockerfile-path:
        type: string
        required: true

jobs:
  build-push-docker-native:
    name: ${{ inputs.name }} Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Install GraalVM
        uses: ./.github/workflows/actions/install-gradle.yml
        with:
          java-version: '21'

      - name: Build native executable
        run: ./gradlew ${{ inputs.project-path-build }}:assemble -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false -Dquarkus.native.container-build=false --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-native
          path: ./build/${{ inputs.name }}/*-runner

      - name: Build Docker Image Native
        uses: ./.github/workflows/actions/build-push-docker.yml
        with:
          name: ${{ inputs.name }}
          image-name: ${{ env.IMAGE_NAME }}
          context: .
          docker-path-file: ${{ inputs.dockerfile-path }}