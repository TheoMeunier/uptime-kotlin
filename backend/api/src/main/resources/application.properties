## General
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.log.category."org.hibernate.validator".level=DEBUG
# Encryption: no default on purpose. Production must set ENCRYPTION_MASTER_KEY (>= 32 bytes, `openssl rand -base64 32`).
# ENCRYPTION_LEGACY_MASTER_KEY is only needed when the previous key was shorter than 32 bytes or changed,
# to keep reading values stored before the switch to HKDF (enc:v1).
%dev.encryption.master-key=dev-only-master-key-do-not-use-in-production
%dev.encryption.legacy-master-key=zfzefzefzef1212zedazdazd
%test.encryption.master-key=test-only-master-key-do-not-use-in-production

scheduler.strategy=none
#scheduler.worker.name=default
#scheduler.worker.concurrency=4

## Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=uptime-kotlin
quarkus.datasource.password=uptime-kotlin
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/uptime-kotlin
quarkus.hibernate-orm.mapping.format.global=ignore

## Migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.placeholders.legacy_timezone=${UPTIME_LEGACY_TIMEZONE:auto}

## Maintenance windows
maintenance.horizon-days=90
maintenance.max-duration-hours=24

## Notifications
# Zone used for dates in Slack, Teams, Telegram and e-mail messages (IANA name, e.g. Europe/Paris). Webhooks stay in UTC.
notifications.display-timezone=UTC

## JWT
mp.jwt.verify.issuer=https://uptime-kotlin.theomeunier.fr/

## CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

## Compilation native
quarkus.native.additional-build-args=\
--initialize-at-run-time=java.net.InetAddress,\
--initialize-at-run-time=java.net.Inet4Address,\
--initialize-at-run-time=java.net.Inet6Address,\
--initialize-at-run-time=org.minidns
quarkus.native.enable-http-url-handler=true
quarkus.native.enable-https-url-handler=true
