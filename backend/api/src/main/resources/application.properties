## General
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.log.category."org.hibernate.validator".level=DEBUG
# Encryption: no default on purpose. Production must set ENCRYPTION_MASTER_KEY (>= 32 bytes, `openssl rand -base64 32`).
# ENCRYPTION_LEGACY_MASTER_KEY is only needed when the previous key was shorter than 32 bytes or changed,
# to keep reading values stored before the switch to HKDF (enc:v1).
# ENCRYPTION_PREVIOUS_MASTER_KEYS (comma-separated) keeps values written with former keys readable during a rotation;
# the API re-encrypts them with ENCRYPTION_MASTER_KEY on startup (see README, "Rotate the master key").
%dev.encryption.master-key=dev-only-master-key-do-not-use-in-production
%dev.encryption.legacy-master-key=zfzefzefzef1212zedazdazd
%test.encryption.master-key=test-only-master-key-do-not-use-in-production

scheduler.strategy=none
#scheduler.worker.name=default
#scheduler.worker.concurrency=4

## Metrics (Prometheus)
# Version published in uptime_build_info, set by the images (APP_VERSION build argument).
uptime.version=${UPTIME_VERSION:dev}
quarkus.management.enabled=false
quarkus.management.port=9000
%prod.quarkus.management.host=0.0.0.0
quarkus.datasource.metrics.enabled=false
quarkus.micrometer.binder.http-server.ignore-patterns=/assets/.+

## Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=uptime-kotlin
quarkus.datasource.password=uptime-kotlin
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/uptime-kotlin
quarkus.hibernate-orm.mapping.format.global=ignore

## Migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.placeholders.legacy_timezone=${UPTIME_LEGACY_TIMEZONE:auto}

## Maintenance windows
maintenance.horizon-days=90
maintenance.max-duration-hours=24

## Notifications
# Zone used for dates in Slack, Teams, Telegram, Matrix, ntfy, Gotify, Web Push and e-mail messages (IANA name, e.g. Europe/Paris). Webhooks stay in UTC.
notifications.display-timezone=UTC
notifications.date-format=dd/MM/yyyy HH:mm:ss VV

# Contact sent to the browser push services in the VAPID token (mailto: address or https URL of the instance owner).
notifications.web-push.subject=https://github.com/TheoMeunier/uptime-kotlin
notifications.pagerduty.events-url=https://events.pagerduty.com/v2/enqueue

## Public demo (DEMO_ENABLED=true): read-only API, seeded demo account, notifications not delivered.
# Set it on the workers too. See README, "Demo mode".
demo.enabled=false
demo.email=demo@uptime-kotlin.dev
demo.password=demo-uptime

## Security
two-factor.issuer=Uptime Kotlin
# Every REST endpoint must declare @RolesAllowed or @PermitAll; an endpoint without one is refused.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

## Reverse proxy
# The host of a request picks the custom domain of a status page, so X-Forwarded-Host must not come from a client.
# Forwarded headers are ignored by default and the Host header is used (the bundled nginx and most proxies keep it).
# Behind a proxy that rewrites Host, set QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING=true and list the proxy
# addresses in QUARKUS_HTTP_PROXY_TRUSTED_PROXIES (IPs or CIDR, comma-separated): headers from any other address are ignored.
quarkus.http.proxy.proxy-address-forwarding=false
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.trusted-proxies=127.0.0.1,::1

## JWT
mp.jwt.verify.issuer=https://uptime-kotlin.theomeunier.fr/

## CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

## Compilation native
quarkus.native.additional-build-args=\
-march=compatibility,\
--initialize-at-run-time=java.net.InetAddress,\
--initialize-at-run-time=java.net.Inet4Address,\
--initialize-at-run-time=java.net.Inet6Address,\
--initialize-at-run-time=org.minidns
quarkus.native.resources.includes=demo/*.json
quarkus.native.enable-http-url-handler=true
quarkus.native.enable-https-url-handler=true
