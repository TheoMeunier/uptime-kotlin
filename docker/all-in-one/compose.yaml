# Test local de l'image tout-en-un.
#   docker compose -f docker/all-in-one/compose.yaml up --build
# Puis http://localhost:8090

services:
  uptime-kotlin:
    build:
      context: ../..
      dockerfile: docker/all-in-one/Dockerfile.native
    image: uptime-kotlin:local
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8090:8080"
    environment:
      QUARKUS_DATASOURCE_USERNAME: uptime-kotlin
      QUARKUS_DATASOURCE_PASSWORD: uptime-kotlin
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/uptime-kotlin
      ENCRYPTION_MASTER_KEY: local-test-key-change-me-32-chars-min
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uptime-kotlin
      POSTGRES_USER: uptime-kotlin
      POSTGRES_PASSWORD: uptime-kotlin
    volumes:
      - uptime-kotlin-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime-kotlin -d uptime-kotlin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uptime-kotlin-db:
