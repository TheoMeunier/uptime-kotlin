services:
  nginx:
    image: nginx:alpine
    container_name: uptime_kotlin_reverse_proxy
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_network

  postgres:
    image: postgres:17.4-alpine
    container_name: uptime_kotlin_database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: uptime-kotlin
      POSTGRES_USER: uptime-kotlin
      POSTGRES_PASSWORD: uptime-kotlin
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./storage-db:/var/lib/postgresql/data
    networks:
      - app_network

  # Redis service
  redis:
    image: redis:latest
    container_name: uptime_kotlin_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app_network

  mongodb:
    image: mongo:8.0
    container_name: uptime_kotlin_mongodb
    restart: unless-stopped
    profiles: [ mongodb ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: uptime
      MONGO_INITDB_ROOT_PASSWORD: uptime
    ports:
      - "27017:27017"
    networks:
      - app_network

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: uptime_kotlin_oracle
    restart: unless-stopped
    profiles: [ oracle ]
    environment:
      ORACLE_PASSWORD: uptime
      APP_USER: uptime
      APP_USER_PASSWORD: uptime
    ports:
      - "1521:1521"
    networks:
      - app_network

  # Container to test the Docker probe: docker compose --profile docker up -d
  # Monitor "uptime_kotlin_docker_test" on unix:///var/run/docker.sock (healthy after ~10 s).
  docker-test:
    image: nginx:alpine
    container_name: uptime_kotlin_docker_test
    restart: unless-stopped
    profiles: [ docker ]
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/" ]
      interval: 5s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: uptime_kotlin_prometheus
    restart: unless-stopped
    profiles: [ monitoring ]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

  grafana:
    image: grafana/grafana:13.2.4
    container_name: uptime_kotlin_grafana
    restart: unless-stopped
    profiles: [ monitoring ]
    ports:
      - "3000:3000"
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/uptime-kotlin.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
