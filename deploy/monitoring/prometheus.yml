global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: uptime-kotlin-api
    metrics_path: /q/metrics
    static_configs:
      - targets: [ "host.docker.internal:9000" ]
        labels:
          role: api

  - job_name: uptime-kotlin-worker
    metrics_path: /q/metrics
    static_configs:
      - targets: [ "host.docker.internal:9002" ]
        labels:
          role: worker
